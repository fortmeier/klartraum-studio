# Builds the Klartraum Studio documentation and deploys it to GitHub Pages.
# Every push and pull request builds the docs; only pushes to main deploy them.
name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The images and videos are stored in Git LFS.
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Sphinx
        run: pip install -r docs/requirements.txt

      # Engine classes link into the published engine API reference. Until
      # that is reachable, build without those links instead of failing.
      - name: Fetch the engine inventory
        run: |
          if curl -fsSL -o "$RUNNER_TEMP/klartraum.inv" https://fortmeier.github.io/klartraum/docs/objects.inv; then
            echo "KLARTRAUM_INVENTORY=$RUNNER_TEMP/klartraum.inv" >> "$GITHUB_ENV"
          else
            echo "::warning::Engine docs inventory not reachable; building without links into the engine API."
            echo "KLARTRAUM_INVENTORY=off" >> "$GITHUB_ENV"
          fi

      - name: Build docs
        run: |
          sphinx-build -W --keep-going docs _site
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  linkcheck:
    # External sites can be flaky, so broken links are reported without
    # failing the workflow.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The images and videos are stored in Git LFS.
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: KLARTRAUM_INVENTORY=off sphinx-build -b linkcheck -q docs docs/_build/linkcheck

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
